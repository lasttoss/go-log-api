<!DOCTYPE html>
<html lang="en">
<!-- diagram-meta {"sources":["README.md","Makefile","internal"]} -->
<head>
<meta charset="utf-8">
<title>Event ingest and rollup</title>
<style>
  :root{
    --paper:#f5f5f5; --paper-2:#ececec; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399;
    --rule:rgba(45,49,66,0.12); --rule-solid:#bfc0c0; --accent:#eb6c36;
    --accent-tint:rgba(235,108,54,0.08);
  }
  html,body{margin:0;background:var(--paper);}
  body{padding:40px;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);}
  figure{margin:0;max-width:1040px;}
  figcaption{margin-top:18px;font-size:13px;line-height:1.55;color:var(--muted);max-width:84ch;}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;}
</style>
</head>
<body>
<figure>
<svg id="ingest" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d">
  <title id="t">Event ingest and rollup: what the handler accepts, what it refuses, and where pressure goes</title>
  <desc id="d">Game servers post a batch of events. Validation rejects a bad event with an index and a reason, and refuses an oversized batch with 413. Accepted batches enter a bounded batcher; when the queue is full the handler answers 503 instead of growing memory. Events land in PostgreSQL and SQL rollups answer dashboard queries.</desc>
  <rect x="0" y="0" width="960" height="430" fill="var(--paper)"/>

  <g>
    <rect x="24" y="76" width="130" height="62" rx="3" fill="var(--paper-2)" stroke="var(--rule-solid)"/>
    <text x="40" y="100" font-size="12.5" font-weight="600" class="mono">game servers</text>
    <text x="40" y="120" font-size="11" fill="var(--muted)">POST /events</text>
  </g>
  <line x1="162" y1="107" x2="196" y2="107" stroke="var(--muted)" stroke-width="1.4"/>
  <polygon points="204,107 194,102 194,112" fill="var(--muted)"/>

  <g>
    <rect x="204" y="66" width="150" height="82" rx="3" fill="var(--paper-2)" stroke="var(--rule-solid)"/>
    <text x="220" y="90" font-size="12.5" font-weight="600" class="mono">validate</text>
    <text x="220" y="110" font-size="11" fill="var(--muted)">per event, in order</text>
    <text x="220" y="127" font-size="11" fill="var(--muted)">index + reason</text>
  </g>

  <!-- rejection branch -->
  <line x1="279" y1="148" x2="279" y2="196" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="3 3"/>
  <polygon points="279,204 274,194 284,194" fill="var(--muted)"/>
  <g>
    <rect x="196" y="204" width="198" height="66" rx="3" fill="none" stroke="var(--rule-solid)"/>
    <text x="210" y="226" font-size="11.5" class="mono" fill="var(--muted)">400 bad event</text>
    <text x="210" y="244" font-size="11" fill="var(--muted)">{"index":"0", reason}</text>
    <text x="210" y="261" font-size="11" fill="var(--muted)">nothing stored</text>
  </g>

  <line x1="362" y1="107" x2="396" y2="107" stroke="var(--muted)" stroke-width="1.4"/>
  <polygon points="404,107 394,102 394,112" fill="var(--muted)"/>

  <g>
    <rect x="404" y="56" width="176" height="102" rx="3" fill="var(--paper-2)" stroke="var(--rule-solid)"/>
    <text x="420" y="80" font-size="12.5" font-weight="600" class="mono">batcher</text>
    <text x="420" y="100" font-size="11" fill="var(--muted)">bounded queue</text>
    <text x="420" y="117" font-size="11" fill="var(--muted)">one write per batch</text>
    <text x="420" y="134" font-size="11" fill="var(--muted)">never unbounded</text>
  </g>

  <!-- backpressure branch, focal -->
  <line x1="492" y1="158" x2="492" y2="196" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <polygon points="492,204 487,194 497,194" fill="var(--accent)"/>
  <g>
    <rect x="404" y="204" width="190" height="66" rx="3" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.4"/>
    <text x="418" y="226" font-size="11.5" class="mono" fill="var(--accent)">503 queue full</text>
    <text x="418" y="244" font-size="11" fill="var(--muted)">refuse, do not buffer</text>
    <text x="418" y="261" font-size="11" fill="var(--muted)">413 if the batch is huge</text>
  </g>

  <line x1="588" y1="107" x2="622" y2="107" stroke="var(--muted)" stroke-width="1.4"/>
  <polygon points="630,107 620,102 620,112" fill="var(--muted)"/>

  <g>
    <rect x="630" y="76" width="140" height="62" rx="3" fill="var(--paper-2)" stroke="var(--rule-solid)"/>
    <text x="646" y="100" font-size="12.5" font-weight="600" class="mono">PostgreSQL</text>
    <text x="646" y="120" font-size="11" fill="var(--muted)">events, indexed</text>
  </g>

  <line x1="700" y1="146" x2="700" y2="196" stroke="var(--muted)" stroke-width="1.4"/>
  <polygon points="700,204 695,194 705,194" fill="var(--muted)"/>

  <g>
    <rect x="612" y="204" width="176" height="66" rx="3" fill="var(--paper-2)" stroke="var(--rule-solid)"/>
    <text x="626" y="226" font-size="12" font-weight="600" class="mono">rollup (SQL)</text>
    <text x="626" y="244" font-size="11" fill="var(--muted)">events, DAU, revenue</text>
    <text x="626" y="261" font-size="11" fill="var(--muted)">per day, per game</text>
  </g>
  <line x1="796" y1="237" x2="832" y2="237" stroke="var(--muted)" stroke-width="1.4"/>
  <polygon points="840,237 830,232 830,242" fill="var(--muted)"/>
  <g>
    <rect x="840" y="204" width="96" height="66" rx="3" fill="var(--paper-2)" stroke="var(--rule-solid)"/>
    <text x="852" y="228" font-size="11.5" font-weight="600" class="mono">GET /</text>
    <text x="852" y="246" font-size="11" fill="var(--muted)">metrics</text>
  </g>

  <line x1="24" y1="316" x2="936" y2="316" stroke="var(--rule)" stroke-width="1"/>
  <text x="24" y="340" font-size="11.5" fill="var(--muted)" class="mono">the smoke test asserts four things: health · a batch is accepted · a bad event is refused with a reason · an oversized batch gets 413</text>
  <text x="24" y="362" font-size="11.5" fill="var(--muted)" class="mono">a rejected event is named by index, so a client can fix the one row instead of resending the batch</text>
</svg>
<figcaption>The interesting decision is at the batcher: a full queue answers 503 instead of accepting work it cannot hold. Rejection is per event, with the index and the reason, so one bad row does not cost the whole batch.</figcaption>
</figure>
</body>
</html>
