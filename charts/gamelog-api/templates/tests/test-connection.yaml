apiVersion: v1
kind: Pod
metadata:
  name: {{ include "gamelog-api.fullname" . }}-test-connection
  labels:
    {{- include "gamelog-api.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: health
      image: {{ include "gamelog-api.image" . | quote }}
      command:
        - sh
        - -c
        - |
          set -e
          echo "asking the service, from inside the cluster, whether it is healthy"
          for i in $(seq 1 30); do
            if wget -qO- "http://{{ include "gamelog-api.fullname" . }}:{{ .Values.service.port }}/healthz"; then
              echo
              echo "healthy, and the database answered"
              exit 0
            fi
            sleep 2
          done
          echo "the service never became healthy"
          exit 1
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
